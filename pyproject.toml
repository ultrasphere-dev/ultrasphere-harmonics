[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ultrasphere-harmonics"
version = "1.3.0"
description = "Hyperspherical harmonics in NumPy / PyTorch / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j", email = "34j.95a2p@simplelogin.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-negative-index>=1",
  "gumerov-expansion-coefficients>=1.2",
  "jacobi-poly>=1.0.5",
  "shift-nth-row-n-steps>=1",
  "ultrasphere>=2.0.4",
]
optional-dependencies.cli = [
  "aquarel>=0.0.7",
  "cyclopts>=3.24",
  "open3d-cpu>=0.19; sys_platform=='linux' and platform_machine=='x86_64'",
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/ultrasphere-harmonics/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/ultrasphere-harmonics/blob/main/CHANGELOG.md"
urls.documentation = "https://ultrasphere-harmonics.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/ultrasphere-harmonics"
scripts.ultrasphere-harmonics = "ultrasphere_harmonics.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "torch>=2.9",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
line-length = 88
extend-exclude = [ "docs/conf.py" ]
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
  "E741"
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "ultrasphere_harmonics", "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
mypy_path = "src/"
exclude = [
  "docs/.*",
]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
overrides = [ { module = "tests.*", allow_untyped_defs = true }, { module = "docs.*", ignore_errors = true } ]
no_implicit_optional = true
show_error_codes = true

[tool.pytest]
# ini_options.pythonpath = [ "src" ]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=ultrasphere_harmonics
    --cov-report=term
    --cov-report=xml
    -p no:doctest
    """

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_variables = [
  "src/ultrasphere_harmonics/__init__.py:__version__",
  "docs/conf.py:release",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
