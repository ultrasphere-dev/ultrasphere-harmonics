[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ultrasphere-harmonics"
version = "1.4.0"
description = "Hyperspherical harmonics in NumPy / PyTorch / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-negative-index>=1",
  "gumerov-expansion-coefficients>=1.2",
  "jacobi-poly>=1.0.5",
  "shift-nth-row-n-steps>=1",
  "ultrasphere>=2.0.4",
]
optional-dependencies.cli = [
  "aquarel>=0.0.7",
  "cyclopts>=3.24",
  "open3d-cpu>=0.19; sys_platform=='linux' and platform_machine=='x86_64'",
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/ultrasphere-harmonics/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/ultrasphere-harmonics/blob/main/CHANGELOG.md"
urls.documentation = "https://ultrasphere-harmonics.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/ultrasphere-harmonics"
scripts.ultrasphere-harmonics = "ultrasphere_harmonics.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.8",
  "pytest",
  "pytest-cov",
  "torch>=2.15.0",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.ignore = [
  "A001",    # public API uses the conventional `type` parameter
  "A002",    # public API uses the conventional `type` parameter
  "BLE001",  # backend availability checks require catching backend exceptions
  "D401",
  "DOC201",  # incompatible with one-line docstring
  "DOC501",
  "DOC502",  # false positives in doctest examples
  "E741",    # incompatible with math code
  "FBT001",  # boolean flags are intentional in numerical APIs
  "FBT003",  # boolean flags are intentional in numerical APIs
  "PD013",   # false positive for array api
  "PLR6104", # preserve non-in-place array operations for broadcasting
  "PLR6301",
  "TRY004",
]
output-prefer-rule-codes = true

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
